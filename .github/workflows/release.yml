name: release

# On a release tag: run the full build.yaml pipeline with the tag
# version, then create a GitHub release carrying the assets tarball
# (which contains the installers) and its checksum.
# Prerelease tags (v1.2.3-rc1) are skipped entirely: MSI ProductVersion
# must be numeric x.y.z and obot-sentry only ships via the MDM installers.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  version:
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Strip the v prefix
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yaml
    permissions:
      contents: read
    # Reusable workflows don't see the caller's secrets unless told to;
    # without this the QUILL_* signing secrets are empty and the release
    # binary ships with only the Go linker's ad-hoc signature.
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download MDM assets
        uses: actions/download-artifact@v8
        with:
          name: mdm-assets
          path: dist/mdm-assets

      - name: Checksum the assets tarball
        run: |
          tar -czf dist/mdm-assets.tar.gz -C dist/mdm-assets .
          (cd dist && sha256sum mdm-assets.tar.gz > checksums.txt)

      - name: Create release and upload assets
        run: |
          gh release create "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" --generate-notes \
            dist/mdm-assets.tar.gz \
            dist/checksums.txt
